<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I'm Cool ✨</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 20%,#fff 0,#f5f1ff 35%,#e7ddff 100%);color:#17121f}
main{text-align:center;padding:48px;position:relative;z-index:2}
.badge{display:inline-block;padding:8px 14px;border-radius:999px;background:#ffffffaa;border:1px solid #ffffff;box-shadow:0 8px 30px #7c3aed18;color:#6d28d9;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
h1{font-size:clamp(64px,14vw,150px);line-height:.9;margin:28px 0 20px;letter-spacing:-.07em;font-weight:900}
h1 span{display:inline-block;background:linear-gradient(90deg,#7c3aed,#ec4899,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0 auto 28px;max-width:520px;color:#655d70;font-size:18px}
button{border:0;border-radius:999px;padding:14px 22px;background:#17121f;color:#fff;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 12px 30px #17121f2b;transition:.2s transform,.2s box-shadow}
button:hover{transform:translateY(-2px);box-shadow:0 16px 36px #17121f3b}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.spark{position:fixed;width:10px;height:16px;top:-30px;z-index:3;pointer-events:none;animation:fall var(--d) linear forwards;transform:rotate(var(--r))}
@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(calc(var(--r) + 720deg));opacity:0}}
@media(max-width:600px){main{padding:28px}p{font-size:16px}}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<main>
<div class="badge">good vibes only</div>
<h1><span>im cool</span></h1>
<p>A tiny page for a very important fact. Press the button if you need more proof.</p>
<button id="celebrate">Celebrate 🎉</button>
</main>
<script>
const colors=["#7c3aed","#ec4899","#f59e0b","#06b6d4","#22c55e","#ef4444"];
function confetti(){
  for(let i=0;i<90;i++){
    const s=document.createElement("i");s.className="spark";
    s.style.left=Math.random()*100+"vw";
    s.style.background=colors[Math.floor(Math.random()*colors.length)];
    s.style.setProperty("--x",(Math.random()*260-130)+"px");
    s.style.setProperty("--d",(2.2+Math.random()*2.8)+"s");
    s.style.setProperty("--r",(Math.random()*360)+"deg");
    s.style.animationDelay=(Math.random()*.35)+"s";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),6000);
  }
}
document.getElementById("celebrate").addEventListener("click",confetti);
confetti();
</script>
</body>
</html>
